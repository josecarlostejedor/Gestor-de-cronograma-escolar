
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Cronograma Escolar - IES Lucía de Medrano</title>
    
    <!-- Dependencias Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
    <!-- Word Export Libs -->
    <script src="https://unpkg.com/docx@8.2.2/build/index.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "docx": "https://esm.sh/docx@^9.5.1",
    "file-saver": "https://esm.sh/file-saver@^2.0.5",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            Plus, FileText, Lock, Calendar: CalendarIcon, 
            Clock, Trash2, ShieldAlert, Download, X 
        } = lucide;

        // --- CONSTANTES ---
        const TIME_SLOTS = [
            { id: '1h', label: '1ª hora', timeRange: '8:50 - 9:45' },
            { id: '2h', label: '2ª hora', timeRange: '9:45 - 10:40' },
            { id: '3h', label: '3ª hora', timeRange: '10:40 - 11:30' },
            { id: 'recreo', label: 'Recreo', timeRange: '11:30 - 11:55' },
            { id: '4h', label: '4ª hora', timeRange: '11:55 - 12:50' },
            { id: '5h', label: '5ª hora', timeRange: '12:50 - 13:45' },
            { id: '6h', label: '6ª hora', timeRange: '13:45 - 14:35' },
        ];

        const DAYS = [
            { date: '23/03', dayName: 'Lunes' },
            { date: '24/03', dayName: 'Martes' },
            { date: '25/03', dayName: 'Miércoles' },
            { date: '26/03', dayName: 'Jueves' },
            { date: '27/03', dayName: 'Viernes' },
        ];

        const PASSWORD_SECRET = '1234';

        // --- COMPONENTE: FORMULARIO ---
        const ActivityForm = ({ isOpen, onClose, onSubmit, dayName, slotLabel }) => {
            const [formData, setFormData] = useState({
                actividad: '', departamento: '', profesor: '', grupo: '', lugar: ''
            });

            if (!isOpen) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
                setFormData({ actividad: '', departamento: '', profesor: '', grupo: '', lugar: '' });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all border border-slate-200">
                        <div className="bg-indigo-700 p-6 text-white flex justify-between items-center">
                            <div>
                                <h3 className="text-xl font-bold">Nueva Actividad</h3>
                                <p className="text-sm opacity-80 mt-1">{dayName} • {slotLabel}</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full">
                                <X size={24} />
                            </button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="p-8 space-y-5">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nombre de la Actividad</label>
                                <input required autoFocus className="block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border" value={formData.actividad} onChange={(e) => setFormData({...formData, actividad: e.target.value})} placeholder="Ej: Taller de Robótica" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Profesor Responsable</label>
                                    <input required className="block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border" value={formData.profesor} onChange={(e) => setFormData({...formData, profesor: e.target.value})} placeholder="Nombre" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Departamento</label>
                                    <input required className="block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border" value={formData.departamento} onChange={(e) => setFormData({...formData, departamento: e.target.value})} placeholder="Ej: Tecnología" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Grupo de Clase</label>
                                    <input required className="block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border" value={formData.grupo} onChange={(e) => setFormData({...formData, grupo: e.target.value})} placeholder="Ej: 1º ESO A" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Lugar</label>
                                    <input required className="block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border" value={formData.lugar} onChange={(e) => setFormData({...formData, lugar: e.target.value})} placeholder="Ej: Laboratorio" />
                                </div>
                            </div>
                            <div className="flex justify-end space-x-3 pt-6 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-5 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200">Cancelar</button>
                                <button type="submit" className="px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 active:scale-95 transition-all">Añadir Actividad</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL ---
        const App = () => {
            const [schedule, setSchedule] = useState(() => {
                const saved = localStorage.getItem('ies-lucia-medrano-v2');
                return saved ? JSON.parse(saved) : {};
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [activeSlot, setActiveSlot] = useState(null);
            const [authAction, setAuthAction] = useState(null);
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState(false);

            useEffect(() => {
                localStorage.setItem('ies-lucia-medrano-v2', JSON.stringify(schedule));
            }, [schedule]);

            const handleAddActivity = (data) => {
                if (!activeSlot) return;
                const id = Math.random().toString(36).substring(2, 9);
                const newActivity = { ...data, id };

                setSchedule(prev => {
                    const dayData = prev[activeSlot.day] || {};
                    const slotActivities = dayData[activeSlot.slotId] || [];
                    return {
                        ...prev,
                        [activeSlot.day]: { ...dayData, [activeSlot.slotId]: [...slotActivities, newActivity] }
                    };
                });
            };

            const exportToWordHandler = async () => {
                const { Document, Packer, Paragraph, Table, TableCell, TableRow, WidthType, AlignmentType, PageOrientation, TextRun, HeadingLevel } = docx;
                
                const tableRows = [
                    new TableRow({
                        children: [
                            new TableCell({ children: [new Paragraph({ text: "Horario", alignment: AlignmentType.CENTER })], shading: { fill: "334155" }, width: { size: 10, type: WidthType.PERCENTAGE } }),
                            ...DAYS.map(day => new TableCell({
                                children: [new Paragraph({ children: [new TextRun({ text: day.dayName, bold: true, color: "FFFFFF", size: 20 })], alignment: AlignmentType.CENTER })],
                                shading: { fill: "334155" }, width: { size: 18, type: WidthType.PERCENTAGE }
                            }))
                        ]
                    })
                ];

                TIME_SLOTS.forEach(slot => {
                    const cells = [
                        new TableCell({
                            children: [new Paragraph({ text: slot.label, alignment: AlignmentType.CENTER }), new Paragraph({ text: slot.timeRange, alignment: AlignmentType.CENTER })],
                            shading: { fill: "F1F5F9" }
                        })
                    ];

                    DAYS.forEach(day => {
                        const activities = schedule[day.dayName]?.[slot.id] || [];
                        const activityParagraphs = activities.flatMap((act, idx) => [
                            new Paragraph({ children: [new TextRun({ text: act.actividad, bold: true, size: 18 })], spacing: { before: idx === 0 ? 0 : 120 } }),
                            new Paragraph({ children: [new TextRun({ text: `Prof: ${act.profesor}`, size: 16, italic: true })] }),
                            new Paragraph({ children: [new TextRun({ text: `${act.departamento} | ${act.grupo} | ${act.lugar}`, size: 14 })] }),
                        ]);
                        cells.push(new TableCell({ children: activities.length > 0 ? activityParagraphs : [new Paragraph("")], margins: { top: 60, bottom: 60, left: 60, right: 60 } }));
                    });
                    tableRows.push(new TableRow({ children: cells }));
                });

                const doc = new Document({
                    sections: [{
                        properties: { page: { size: { width: 16838, height: 11906, orientation: PageOrientation.LANDSCAPE } } },
                        children: [
                            new Paragraph({ text: "CRONOGRAMA SEMANA CULTURAL IES LUCÍA DE MEDRANO", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER, spacing: { after: 300 } }),
                            new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows })
                        ]
                    }]
                });

                const blob = await Packer.toBlob(doc);
                saveAs(blob, "Cronograma_Semana_Cultural.docx");
            };

            const confirmAction = () => {
                if (passwordInput === PASSWORD_SECRET) {
                    if (authAction === 'export') exportToWordHandler();
                    else if (authAction === 'clear') { setSchedule({}); localStorage.clear(); }
                    setAuthAction(null); setPasswordInput(''); setPasswordError(false);
                } else {
                    setPasswordError(true);
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 pb-12">
                    <header className="bg-white border-b border-slate-200 px-8 py-6 shadow-sm flex items-center justify-between sticky top-0 z-40">
                        <div className="flex items-center gap-4">
                            <div className="p-3 bg-indigo-700 text-white rounded-2xl shadow-lg"><CalendarIcon size={32} /></div>
                            <div>
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight">IES Lucía de Medrano</h1>
                                <p className="text-sm font-bold text-indigo-600">Semana Cultural 23-27 Marzo</p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setAuthAction('clear')} className="flex items-center gap-2 bg-white border-2 border-red-100 text-red-600 px-5 py-2.5 rounded-xl font-bold hover:bg-red-50 transition-all"><Trash2 size={18} /> Borrar</button>
                            <button onClick={() => setAuthAction('export')} className="flex items-center gap-2 bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-800 transition-all shadow-md"><FileText size={20} /> Exportar Word</button>
                        </div>
                    </header>

                    <main className="max-w-[1500px] mx-auto p-4 md:p-8">
                        <div className="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-2xl custom-scrollbar">
                            <table className="w-full border-collapse min-w-[1200px]">
                                <thead>
                                    <tr className="bg-slate-800 text-white">
                                        <th className="p-5 border-b border-slate-700 w-40 sticky left-0 z-20 bg-slate-800 text-xs font-bold uppercase tracking-widest text-slate-400">Horario</th>
                                        {DAYS.map(day => (
                                            <th key={day.dayName} className="p-6 border-b border-slate-700 min-w-[220px]">
                                                <div className="font-black text-xl">{day.dayName}</div>
                                                <div className="text-slate-400 font-bold text-sm mt-1">{day.date}</div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {TIME_SLOTS.map(slot => (
                                        <tr key={slot.id} className={slot.id === 'recreo' ? 'bg-indigo-50/40' : 'hover:bg-slate-50 transition-colors'}>
                                            <td className="p-5 border-b border-r border-slate-100 sticky left-0 z-20 bg-white shadow-sm">
                                                <div className="text-slate-900 font-black text-center">{slot.label}</div>
                                                <div className="text-indigo-500 text-[10px] mt-1 font-bold text-center bg-indigo-50 rounded-full py-1">{slot.timeRange}</div>
                                            </td>
                                            {DAYS.map(day => {
                                                const activities = schedule[day.dayName]?.[slot.id] || [];
                                                return (
                                                    <td key={`${day.dayName}-${slot.id}`} className="p-4 border-b border-slate-100 align-top">
                                                        <div className="space-y-3 mb-3">
                                                            {activities.map(act => (
                                                                <div key={act.id} className="bg-white border-l-4 border-l-indigo-600 border border-slate-200 p-4 rounded-xl text-sm shadow-sm">
                                                                    <div className="font-bold text-slate-800 text-base leading-tight mb-2">{act.actividad}</div>
                                                                    <p className="text-indigo-700 font-bold text-xs">Prof: {act.profesor}</p>
                                                                    <p className="text-slate-500 text-[11px] font-medium mt-1">{act.departamento} | {act.lugar}</p>
                                                                    <div className="mt-1 text-[10px] font-black text-indigo-400 uppercase tracking-widest">{act.grupo}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button onClick={() => { setActiveSlot({day: day.dayName, slotId: slot.id, label: slot.label}); setIsModalOpen(true); }} className="w-full py-3 flex items-center justify-center gap-2 border-2 border-dashed border-slate-100 text-slate-300 rounded-xl hover:border-indigo-200 hover:text-indigo-500 transition-all">
                                                            <Plus size={20} /> <span className="text-[10px] font-bold uppercase tracking-widest">Añadir</span>
                                                        </button>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    {authAction && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl p-10 max-w-sm w-full text-center">
                                <div className={`inline-block p-5 rounded-3xl mb-6 ${authAction === 'clear' ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600'}`}>
                                    {authAction === 'clear' ? <ShieldAlert size={40} /> : <Lock size={40} />}
                                </div>
                                <h3 className="text-2xl font-black mb-2">Clave de Seguridad</h3>
                                <p className="text-slate-500 text-sm mb-8">Introduce 1234 para continuar.</p>
                                <input type="password" autoFocus className="w-full p-4 border-2 border-slate-100 rounded-2xl text-center text-2xl font-bold tracking-widest outline-none focus:ring-4 focus:ring-indigo-100 transition-all" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && confirmAction()} placeholder="••••" />
                                {passwordError && <p className="text-red-500 text-xs mt-3 font-bold">Contraseña incorrecta</p>}
                                <div className="mt-10 flex flex-col gap-3">
                                    <button onClick={confirmAction} className={`w-full py-4 rounded-2xl text-white font-black shadow-lg active:scale-95 transition-all ${authAction === 'clear' ? 'bg-red-600' : 'bg-indigo-700'}`}>Confirmar</button>
                                    <button onClick={() => { setAuthAction(null); setPasswordInput(''); }} className="w-full py-2 text-slate-400 font-bold">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ActivityForm isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSubmit={handleAddActivity} dayName={activeSlot?.day || ''} slotLabel={activeSlot?.label || ''} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
