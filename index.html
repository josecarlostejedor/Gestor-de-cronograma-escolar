
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IES Lucía de Medrano - Cronograma Oficial</title>
    
    <!-- Librerías base (Carga Global Segura) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías de Exportación (UMD - No necesitan importmap) -->
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .recreo-row { background-color: #f0f7ff !important; }
        /* Animación de entrada para nuevas actividades */
        .activity-card { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "docx": "https://esm.sh/docx@^9.5.1",
    "file-saver": "https://esm.sh/file-saver@^2.0.5",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Iconos SVG consistentes
        const IconPlus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconFile = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>;
        const IconTrash = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconLock = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;

        const TIME_SLOTS = [
            { id: '1h', label: '1ª hora', timeRange: '8:50 - 9:45' },
            { id: '2h', label: '2ª hora', timeRange: '9:45 - 10:40' },
            { id: '3h', label: '3ª hora', timeRange: '10:40 - 11:30' },
            { id: 'recreo', label: 'Recreo', timeRange: '11:30 - 11:55' },
            { id: '4h', label: '4ª hora', timeRange: '11:55 - 12:50' },
            { id: '5h', label: '5ª hora', timeRange: '12:50 - 13:45' },
            { id: '6h', label: '6ª hora', timeRange: '13:45 - 14:35' },
        ];

        const DAYS = [
            { date: '23/03', dayName: 'Lunes' },
            { date: '24/03', dayName: 'Martes' },
            { date: '25/03', dayName: 'Miércoles' },
            { date: '26/03', dayName: 'Jueves' },
            { date: '27/03', dayName: 'Viernes' },
        ];

        const STORAGE_KEY = 'ies-lucia-medrano-v18-final';

        const App = () => {
            // Inicialización de estado desde LocalStorage
            const [schedule, setSchedule] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    console.error("Error al cargar datos persistentes:", e);
                    return {};
                }
            });

            const [modal, setModal] = useState({ open: false, day: '', slotId: '' });
            const [formData, setFormData] = useState({ actividad: '', departamento: '', profesor: '', grupo: '', lugar: '' });
            const [auth, setAuth] = useState({ active: false, type: '', pass: '' });

            // Efecto de guardado automático cada vez que cambia el horario
            useEffect(() => { 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule)); 
            }, [schedule]);

            const handleExport = async () => {
                try {
                    const d = window.docx || window.Docx;
                    if (!d || !d.Document) throw new Error("La librería Word (docx) no está disponible. Recarga la página.");

                    const { Document, Packer, Paragraph, Table, TableCell, TableRow, WidthType, AlignmentType, PageOrientation, TextRun, HeadingLevel, VerticalAlign } = d;
                    
                    const tableRows = [
                        new TableRow({
                            children: [
                                new TableCell({ 
                                    children: [new Paragraph({ text: "HORA", alignment: AlignmentType.CENTER })], 
                                    shading: { fill: "1e293b" },
                                    verticalAlign: VerticalAlign.CENTER,
                                    width: { size: 10, type: WidthType.PERCENTAGE }
                                }),
                                ...DAYS.map(d => new TableCell({ 
                                    children: [new Paragraph({ children: [new TextRun({ text: d.dayName, bold: true, color: "FFFFFF" })], alignment: AlignmentType.CENTER })], 
                                    shading: { fill: "1e293b" },
                                    verticalAlign: VerticalAlign.CENTER,
                                    width: { size: 18, type: WidthType.PERCENTAGE }
                                }))
                            ]
                        })
                    ];

                    TIME_SLOTS.forEach(slot => {
                        const cells = [
                            new TableCell({ 
                                children: [
                                    new Paragraph({ text: slot.label, alignment: AlignmentType.CENTER, spacing: { before: 100 } }), 
                                    new Paragraph({ text: slot.timeRange, alignment: AlignmentType.CENTER, spacing: { after: 100 } })
                                ], 
                                shading: { fill: slot.id === 'recreo' ? "f0f7ff" : "f8fafc" },
                                verticalAlign: VerticalAlign.CENTER
                            })
                        ];
                        DAYS.forEach(day => {
                            const acts = schedule[day.dayName]?.[slot.id] || [];
                            const paras = acts.flatMap(a => [
                                new Paragraph({ children: [new TextRun({ text: a.actividad, bold: true, size: 20 })] }),
                                new Paragraph({ children: [new TextRun({ text: `Prof: ${a.profesor}`, size: 16, italic: true })] }),
                                new Paragraph({ children: [new TextRun({ text: `${a.departamento} | ${a.grupo} | ${a.lugar}`, size: 14 })], spacing: { after: 200 } })
                            ]);
                            cells.push(new TableCell({ 
                                children: paras.length > 0 ? paras : [new Paragraph("")],
                                margins: { top: 100, bottom: 100, left: 100, right: 100 },
                                verticalAlign: VerticalAlign.TOP
                            }));
                        });
                        tableRows.push(new TableRow({ children: cells }));
                    });

                    const doc = new Document({
                        sections: [{
                            properties: { page: { size: { orientation: PageOrientation.LANDSCAPE } } },
                            children: [
                                new Paragraph({ 
                                    text: "CRONOGRAMA SEMANA CULTURAL IES LUCÍA DE MEDRANO", 
                                    heading: HeadingLevel.HEADING_1, 
                                    alignment: AlignmentType.CENTER, 
                                    spacing: { after: 400 } 
                                }),
                                new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows })
                            ]
                        }]
                    });

                    const blob = await Packer.toBlob(doc);
                    window.saveAs(blob, "Cronograma_Completo_Lucia_Medrano.docx");
                } catch (err) {
                    alert("Error en exportación: " + err.message);
                }
            };

            const confirmAuth = () => {
                if (auth.pass === '1234') {
                    if (auth.type === 'export') handleExport();
                    else if (auth.type === 'clear') { 
                        setSchedule({}); 
                        localStorage.removeItem(STORAGE_KEY);
                        alert("Cronograma reiniciado correctamente.");
                    }
                    setAuth({ active: false, type: '', pass: '' });
                } else {
                    alert("Clave de seguridad incorrecta.");
                }
            };

            const saveActivity = () => {
                if (!formData.actividad) return alert("Por favor, introduce el nombre de la actividad.");
                setSchedule(prev => {
                    const day = prev[modal.day] || {};
                    const slot = day[modal.slotId] || [];
                    const newSchedule = { 
                        ...prev, 
                        [modal.day]: { 
                            ...day, 
                            [modal.slotId]: [...slot, { ...formData, id: Date.now().toString() }] 
                        } 
                    };
                    return newSchedule;
                });
                setModal({ open: false, day: '', slotId: '' });
                setFormData({ actividad: '', departamento: '', profesor: '', grupo: '', lugar: '' });
            };

            return (
                <div className="min-h-screen pb-10 flex flex-col">
                    <header className="bg-white border-b p-4 md:p-6 flex flex-col md:flex-row items-center justify-between sticky top-0 z-40 shadow-sm gap-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-700 text-white p-3 rounded-2xl shadow-lg"><IconFile /></div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black text-slate-800 tracking-tight">IES Lucía de Medrano</h1>
                                <p className="text-[10px] md:text-xs font-bold text-green-600 uppercase tracking-widest flex items-center gap-2">
                                    <span className="inline-block w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                                    Base de Datos Activa y Persistente
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setAuth({active: true, type: 'clear', pass: ''})} className="flex items-center gap-2 text-slate-400 bg-slate-100 px-4 py-2.5 rounded-xl font-bold text-xs hover:bg-red-50 hover:text-red-500 transition-all border border-transparent hover:border-red-100">
                                <IconTrash /> Limpiar Todo
                            </button>
                            <button onClick={() => setAuth({active: true, type: 'export', pass: ''})} className="flex items-center gap-2 bg-indigo-700 text-white px-6 py-3 rounded-xl font-black shadow-xl hover:bg-indigo-800 transition-all text-sm active:scale-95">
                                <IconFile /> Descargar Word
                            </button>
                        </div>
                    </header>

                    <main className="p-4 md:p-8 flex-1 w-full max-w-[1700px] mx-auto">
                        <div className="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-x-auto custom-scrollbar">
                            <table className="w-full border-collapse min-w-[1200px] table-fixed">
                                <thead>
                                    <tr className="bg-slate-800 text-white">
                                        <th className="p-6 w-40 sticky left-0 z-20 bg-slate-800 text-[10px] font-black uppercase opacity-60 text-center">Horario Oficial</th>
                                        {DAYS.map(d => <th key={d.dayName} className="p-6 text-left border-l border-slate-700 w-[18%]"><div className="text-xl font-black">{d.dayName}</div><div className="text-[10px] font-bold opacity-40 uppercase tracking-[0.2em]">{d.date}</div></th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {TIME_SLOTS.map(slot => (
                                        <tr key={slot.id} className={slot.id === 'recreo' ? 'recreo-row' : 'hover:bg-slate-50/50 transition-colors'}>
                                            <td className="p-6 border-b border-r sticky left-0 bg-white z-20 text-center">
                                                <div className={`font-black text-sm ${slot.id === 'recreo' ? 'text-blue-600' : 'text-slate-800'}`}>{slot.label}</div>
                                                <div className={`text-[9px] font-bold px-3 py-1 rounded-full mt-2 inline-block ${slot.id === 'recreo' ? 'text-blue-600 bg-blue-100' : 'text-indigo-600 bg-indigo-50'}`}>{slot.timeRange}</div>
                                            </td>
                                            {DAYS.map(day => {
                                                const acts = schedule[day.dayName]?.[slot.id] || [];
                                                return (
                                                    <td key={day.dayName+slot.id} className="p-4 border-b border-slate-100 align-top min-h-[180px]">
                                                        <div className="space-y-4 mb-4">
                                                            {acts.map((a) => (
                                                                <div key={a.id} className="activity-card bg-white border-l-[6px] border-indigo-600 border border-slate-200 p-4 rounded-2xl shadow-sm hover:shadow-md transition-all text-xs group">
                                                                    <div className="font-bold text-slate-900 mb-2 leading-tight text-sm uppercase">{a.actividad}</div>
                                                                    <div className="text-[11px] font-black text-indigo-700 bg-indigo-50/50 p-2 rounded-lg mb-2">Profesor/a: {a.profesor}</div>
                                                                    <div className="grid grid-cols-1 gap-1 text-[10px] text-slate-500 font-bold opacity-70">
                                                                        <div className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span> DPTO: {a.departamento}</div>
                                                                        <div className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span> GRUPO: {a.grupo}</div>
                                                                        <div className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span> LUGAR: {a.lugar}</div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button 
                                                            onClick={() => setModal({open: true, day: day.dayName, slotId: slot.id})} 
                                                            className="w-full py-4 flex flex-col items-center justify-center gap-1 border-2 border-dashed border-slate-200 text-slate-300 rounded-2xl hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50/30 transition-all group"
                                                        >
                                                            <IconPlus />
                                                            <span className="text-[9px] font-black uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Programar</span>
                                                        </button>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    {/* Modal de Introducción de Datos */}
                    {modal.open && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center z-[60] p-4">
                            <div className="bg-white rounded-[3rem] w-full max-w-lg overflow-hidden shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] border border-white/20">
                                <div className="bg-indigo-700 p-10 text-white text-center">
                                    <h2 className="text-3xl font-black tracking-tight">Añadir Actividad</h2>
                                    <p className="text-xs opacity-70 mt-3 font-bold uppercase tracking-[0.2em]">{modal.day} • {TIME_SLOTS.find(s=>s.id===modal.slotId)?.label}</p>
                                </div>
                                <div className="p-10 space-y-5">
                                    <div className="space-y-1.5">
                                        <label className="text-[11px] font-black text-indigo-600 uppercase ml-1">Nombre de la Actividad</label>
                                        <input autoFocus className="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-500 focus:bg-white outline-none text-sm transition-all font-bold" placeholder="..." value={formData.actividad} onChange={e=>setFormData({...formData, actividad: e.target.value})} />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-[11px] font-black text-indigo-600 uppercase ml-1">Docente Responsable</label>
                                        <input className="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-500 focus:bg-white outline-none text-sm transition-all font-bold" placeholder="..." value={formData.profesor} onChange={e=>setFormData({...formData, profesor: e.target.value})} />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-[11px] font-black text-indigo-600 uppercase ml-1">Departamento</label>
                                        <input className="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-500 focus:bg-white outline-none text-sm transition-all font-bold" placeholder="..." value={formData.departamento} onChange={e=>setFormData({...formData, departamento: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-[11px] font-black text-indigo-600 uppercase ml-1">Grupo/s</label>
                                            <input className="p-4 w-full bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-500 focus:bg-white outline-none text-sm transition-all font-bold" placeholder="..." value={formData.grupo} onChange={e=>setFormData({...formData, grupo: e.target.value})} />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-[11px] font-black text-indigo-600 uppercase ml-1">Aula / Lugar</label>
                                            <input className="p-4 w-full bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-500 focus:bg-white outline-none text-sm transition-all font-bold" placeholder="..." value={formData.lugar} onChange={e=>setFormData({...formData, lugar: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="flex gap-4 pt-8">
                                        <button onClick={()=>setModal({open:false})} className="flex-1 py-5 font-bold text-slate-400 hover:text-slate-600 transition-all uppercase text-xs">Descartar</button>
                                        <button onClick={saveActivity} className="flex-[2] py-5 font-black text-white bg-indigo-600 rounded-[1.5rem] shadow-xl hover:bg-indigo-700 transition-all uppercase text-xs tracking-widest active:scale-95">Guardar en Memoria</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Seguridad: Clave de Validación */}
                    {auth.active && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-12 rounded-[4rem] max-w-sm w-full text-center shadow-[0_0_100px_rgba(79,70,229,0.2)]">
                                <div className="inline-block p-7 bg-indigo-50 text-indigo-600 rounded-full mb-8"><IconLock /></div>
                                <h3 className="text-3xl font-black mb-2 text-slate-800 tracking-tight">Validación</h3>
                                <p className="text-[10px] text-slate-400 mb-10 uppercase tracking-[0.3em] font-black">Control de Seguridad</p>
                                <input 
                                    type="password" 
                                    autoFocus 
                                    className="w-full p-6 text-center text-5xl font-black border-4 border-slate-50 rounded-[2rem] outline-none focus:border-indigo-500 transition-all tracking-[0.6em] bg-slate-50/50" 
                                    placeholder="••••" 
                                    value={auth.pass} 
                                    onChange={e=>setAuth({...auth, pass: e.target.value})} 
                                    onKeyDown={e=>e.key==='Enter'&&confirmAuth()} 
                                />
                                <div className="mt-10 flex flex-col gap-4">
                                    <button onClick={confirmAuth} className="w-full py-6 bg-indigo-700 text-white font-black rounded-3xl shadow-2xl hover:bg-indigo-800 transition-all uppercase tracking-widest text-sm active:scale-95">Autorizar Acción</button>
                                    <button onClick={() => setAuth({active: false})} className="w-full py-3 text-slate-300 font-bold hover:text-slate-500 transition-all text-xs">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
