<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IES Lucía de Medrano - Horario Cultural</title>
    
    <!-- Librerías Core (Versiones unificadas) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Exportación Word -->
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
        .recreo-row { background-color: #f0f9ff !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root:empty::before {
            content: 'Iniciando Calendario IES...';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #4338ca;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // URL ÚNICA DE BASE DE DATOS
        const CLOUD_URL = 'https://api.keyvalue.xyz/0f8c2e4a/ies-lucia-medrano-v3';
        const PASS = '1234';

        const TIME_SLOTS = [
            { id: '1h', label: '1ª hora', timeRange: '8:50 - 9:45' },
            { id: '2h', label: '2ª hora', timeRange: '9:45 - 10:40' },
            { id: '3h', label: '3ª hora', timeRange: '10:40 - 11:30' },
            { id: 'recreo', label: 'Recreo', timeRange: '11:30 - 12:00' },
            { id: '4h', label: '4ª hora', timeRange: '12:00 - 12:55' },
            { id: '5h', label: '5ª hora', timeRange: '12:55 - 13:45' },
            { id: '6h', label: '6ª hora', timeRange: '13:45 - 14:35' },
        ];

        const DAYS = [
            { date: '23/03', dayName: 'Lunes' },
            { date: '24/03', dayName: 'Martes' },
            { date: '25/03', dayName: 'Miércoles' },
            { date: '26/03', dayName: 'Jueves' },
            { date: '27/03', dayName: 'Viernes' },
        ];

        const App = () => {
            const [schedule, setSchedule] = useState({});
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);
            const [modal, setModal] = useState({ open: false, day: '', slotId: '' });
            const [auth, setAuth] = useState({ active: false, type: '', pass: '' });
            const [formData, setFormData] = useState({ actividad: '', profesor: '', dpto: '', grupo: '', lugar: '' });

            const fetchCloud = useCallback(async (isInit = false) => {
                if (isInit) setLoading(true);
                setSyncing(true);
                try {
                    // Timeout de 5 segundos para no bloquear la app
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    const r = await fetch(CLOUD_URL, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (r.ok) {
                        const d = await r.json();
                        if (d && typeof d === 'object') setSchedule(d);
                    }
                } catch (e) { 
                    console.warn("Servidor ocupado o modo offline. Usando datos locales."); 
                } finally { 
                    setLoading(false); 
                    setSyncing(false); 
                }
            }, []);

            const saveCloud = async (newS) => {
                setSyncing(true);
                try {
                    await fetch(CLOUD_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newS)
                    });
                } catch (e) { console.error("Error al guardar:", e); }
                finally { setSyncing(false); }
            };

            useEffect(() => {
                fetchCloud(true);
                // Sincronización automática cada 20 segundos
                const inv = setInterval(() => {
                    if (!modal.open && !auth.active) fetchCloud();
                }, 20000);
                return () => clearInterval(inv);
            }, [fetchCloud]);

            const handleAdd = async () => {
                if (!formData.actividad.trim()) return;
                const newS = { ...schedule };
                if (!newS[modal.day]) newS[modal.day] = {};
                if (!newS[modal.day][modal.slotId]) newS[modal.day][modal.slotId] = [];
                
                newS[modal.day][modal.slotId].push({ 
                    ...formData, 
                    id: Date.now() 
                });
                
                setSchedule(newS);
                setModal({ open: false });
                setFormData({ actividad: '', profesor: '', dpto: '', grupo: '', lugar: '' });
                await saveCloud(newS);
            };

            const handleExport = async () => {
                const { Document, Packer, Paragraph, Table, TableCell, TableRow, WidthType, AlignmentType, PageOrientation, TextRun, HeadingLevel } = window.docx;
                
                const tableRows = [
                    new TableRow({
                        children: [
                            new TableCell({ children: [new Paragraph({ text: "HORA", alignment: AlignmentType.CENTER })], shading: { fill: "1e293b" } }),
                            ...DAYS.map(d => new TableCell({ 
                                children: [new Paragraph({ children: [new TextRun({ text: d.dayName.toUpperCase(), bold: true, color: "FFFFFF" })], alignment: AlignmentType.CENTER })], 
                                shading: { fill: "1e293b" } 
                            }))
                        ]
                    })
                ];

                TIME_SLOTS.forEach(slot => {
                    const cells = [
                        new TableCell({
                            children: [
                                new Paragraph({ text: slot.label, alignment: AlignmentType.CENTER, spacing: { before: 100 } }), 
                                new Paragraph({ text: slot.timeRange, alignment: AlignmentType.CENTER, spacing: { after: 100 } })
                            ],
                            shading: { fill: slot.id === 'recreo' ? "f1f5f9" : "ffffff" }
                        })
                    ];
                    DAYS.forEach(day => {
                        const acts = schedule[day.dayName]?.[slot.id] || [];
                        const content = acts.flatMap(a => [
                            new Paragraph({ children: [new TextRun({ text: a.actividad.toUpperCase(), bold: true, size: 18 })] }),
                            new Paragraph({ children: [new TextRun({ text: `Prof: ${a.profesor}`, size: 16 })] }),
                            new Paragraph({ children: [new TextRun({ text: `${a.grupo} | ${a.lugar}`, size: 14, color: "666666" })], spacing: { after: 150 } })
                        ]);
                        cells.push(new TableCell({ children: content.length > 0 ? content : [new Paragraph("")] }));
                    });
                    tableRows.push(new TableRow({ children: cells }));
                });

                const doc = new Document({
                    sections: [{
                        properties: { page: { size: { orientation: PageOrientation.LANDSCAPE } } },
                        children: [
                            new Paragraph({ text: "IES LUCÍA DE MEDRANO - SEMANA CULTURAL", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER, spacing: { after: 400 } }),
                            new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows })
                        ]
                    }]
                });

                const blob = await Packer.toBlob(doc);
                saveAs(blob, "Calendario_IES_Lucia_Medrano.docx");
            };

            const checkAuth = () => {
                if (auth.pass === PASS) {
                    if (auth.type === 'export') handleExport();
                    if (auth.type === 'clear') { setSchedule({}); saveCloud({}); }
                    setAuth({ active: false, pass: '', type: '' });
                } else {
                    alert("Acceso Denegado");
                    setAuth({ ...auth, pass: '' });
                }
            };

            if (loading) return null; // Muestra el mensaje de CSS mientras carga

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-white border-b p-6 px-10 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-40 shadow-sm">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 text-white p-3 rounded-2xl shadow-lg">
                                <lucide.Calendar size={24} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black text-slate-900 tracking-tight">IES Lucía de Medrano</h1>
                                <div className="flex items-center gap-2">
                                    <span className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Semana Cultural • 23-27 Marzo</span>
                                    {syncing && <lucide.RefreshCw size={12} className="text-indigo-500 animate-spin ml-1" />}
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setAuth({active: true, type: 'clear', pass: ''})} className="p-3 text-slate-200 hover:text-red-500 transition-colors">
                                <lucide.Trash2 size={20} />
                            </button>
                            <button onClick={() => setAuth({active: true, type: 'export', pass: ''})} className="bg-indigo-600 text-white px-8 py-3.5 rounded-2xl font-black text-xs shadow-xl hover:bg-indigo-700 transition-all active:scale-95 flex items-center gap-2">
                                <lucide.FileText size={16} /> EXPORTAR WORD
                            </button>
                        </div>
                    </header>

                    <main className="p-4 md:p-8 overflow-x-auto custom-scrollbar">
                        <div className="bg-white border border-slate-200 rounded-[3rem] shadow-2xl overflow-hidden min-w-[1300px]">
                            <table className="w-full border-collapse table-fixed">
                                <thead>
                                    <tr className="bg-slate-900 text-white">
                                        <th className="w-44 p-6 text-[10px] font-black uppercase opacity-40 text-center tracking-widest">Franja Horaria</th>
                                        {DAYS.map(d => (
                                            <th key={d.dayName} className="p-6 text-left border-l border-white/5">
                                                <div className="text-2xl font-black">{d.dayName}</div>
                                                <div className="text-[10px] font-bold text-indigo-400 uppercase mt-1 tracking-widest">{d.date}</div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {TIME_SLOTS.map(slot => (
                                        <tr key={slot.id} className={slot.id === 'recreo' ? 'recreo-row' : 'hover:bg-slate-50/50 transition-colors'}>
                                            <td className="p-6 border-b border-slate-100 text-center border-r bg-slate-50/10">
                                                <div className="font-black text-xs text-slate-900 uppercase tracking-tighter">{slot.label}</div>
                                                <div className="text-[10px] font-bold text-indigo-600 mt-2 flex items-center justify-center gap-1">
                                                    <lucide.Clock size={12} /> {slot.timeRange}
                                                </div>
                                            </td>
                                            {DAYS.map(day => {
                                                const acts = schedule[day.dayName]?.[slot.id] || [];
                                                return (
                                                    <td key={day.dayName+slot.id} className="p-3 border-b border-slate-100 align-top">
                                                        <div className="space-y-3 mb-3">
                                                            {acts.map(a => (
                                                                <div key={a.id} className="bg-white border-l-4 border-l-indigo-600 border border-slate-200 p-4 rounded-2xl shadow-sm hover:shadow-xl transition-all animate-in slide-in-from-top-2 duration-300">
                                                                    <div className="font-black text-xs text-slate-900 uppercase mb-2 leading-tight">{a.actividad}</div>
                                                                    <div className="text-[10px] font-bold text-indigo-700 bg-indigo-50 p-2 rounded-xl mb-2 flex items-center gap-1">
                                                                        <lucide.User size={12} /> {a.profesor}
                                                                    </div>
                                                                    <div className="flex flex-wrap gap-2 text-[9px] font-bold text-slate-400 uppercase">
                                                                        <span className="flex items-center gap-1"><lucide.MapPin size={10} /> {a.lugar}</span>
                                                                        <span className="flex items-center gap-1"><lucide.Users size={10} /> {a.grupo}</span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button 
                                                            onClick={() => setModal({open: true, day: day.dayName, slotId: slot.id})} 
                                                            className="w-full py-5 border-2 border-dashed border-slate-100 rounded-3xl text-slate-300 hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 transition-all flex items-center justify-center gap-2 group"
                                                        >
                                                            <lucide.Plus size={20} className="group-hover:rotate-90 transition-transform" />
                                                            <span className="text-[9px] font-black uppercase tracking-widest">Programar</span>
                                                        </button>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    {/* Modal Añadir Actividad */}
                    {modal.open && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-lg overflow-hidden border border-white/20 animate-in zoom-in duration-300">
                                <div className="bg-indigo-600 p-10 text-white text-center">
                                    <h2 className="text-3xl font-black uppercase tracking-tighter">Nueva Actividad</h2>
                                    <p className="text-[10px] font-bold opacity-60 mt-3">{modal.day} • {TIME_SLOTS.find(s=>s.id===modal.slotId)?.label}</p>
                                </div>
                                <div className="p-10 space-y-4">
                                    <input autoFocus placeholder="Nombre de la Actividad" className="w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-600 outline-none text-sm font-bold" value={formData.actividad} onChange={e=>setFormData({...formData, actividad: e.target.value})} />
                                    <input placeholder="Docente Responsable" className="w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-600 outline-none text-sm font-bold" value={formData.profesor} onChange={e=>setFormData({...formData, profesor: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input placeholder="Departamento" className="w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-600 outline-none text-sm font-bold" value={formData.dpto} onChange={e=>setFormData({...formData, dpto: e.target.value})} />
                                        <input placeholder="Grupo(s)" className="w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-600 outline-none text-sm font-bold" value={formData.grupo} onChange={e=>setFormData({...formData, grupo: e.target.value})} />
                                    </div>
                                    <input placeholder="Aula o Recinto" className="w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl focus:border-indigo-600 outline-none text-sm font-bold" value={formData.lugar} onChange={e=>setFormData({...formData, lugar: e.target.value})} />
                                    <div className="flex gap-4 pt-4">
                                        <button onClick={()=>setModal({open: false})} className="flex-1 py-5 bg-slate-100 text-slate-500 font-bold rounded-2xl hover:bg-slate-200 transition-all uppercase text-[10px]">Cancelar</button>
                                        <button onClick={handleAdd} className="flex-[2] py-5 bg-indigo-600 text-white font-black rounded-2xl shadow-xl hover:bg-indigo-700 transition-all uppercase text-xs tracking-widest">Publicar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Autorización */}
                    {auth.active && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-2xl z-[100] flex items-center justify-center p-4">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-sm text-center shadow-2xl">
                                <div className="bg-indigo-50 text-indigo-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-8"><lucide.Lock size={32} /></div>
                                <h3 className="text-3xl font-black text-slate-800 mb-2">Clave</h3>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-10">Usa 1234 para continuar</p>
                                <input 
                                    type="password" 
                                    autoFocus 
                                    className="w-full p-7 bg-slate-50 border-2 border-transparent rounded-[2.5rem] focus:border-indigo-600 outline-none text-center text-4xl font-black mb-10" 
                                    value={auth.pass} 
                                    onChange={e=>setAuth({...auth, pass: e.target.value})} 
                                    onKeyDown={e=>e.key==='Enter'&&checkAuth()} 
                                    placeholder="••••"
                                />
                                <div className="flex flex-col gap-3">
                                    <button onClick={checkAuth} className="w-full py-6 bg-indigo-600 text-white font-black rounded-[2rem] shadow-xl uppercase text-xs tracking-widest">Confirmar</button>
                                    <button onClick={()=>setAuth({active: false, type: '', pass: ''})} className="w-full py-2 text-slate-300 font-bold text-[10px]">CERRAR</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
