<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IES Lucía de Medrano - Calendario Semana Cultural</title>
    
    <!-- Librerías de confianza (Versiones estables) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos y Word -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .recreo-row { background-color: #f0f9ff !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root:empty::before {
            content: 'Cargando aplicación escolar...';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #4f46e5;
            font-weight: 800;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TIME_SLOTS = [
            { id: '1h', label: '1ª hora', timeRange: '8:50 - 9:45' },
            { id: '2h', label: '2ª hora', timeRange: '9:45 - 10:40' },
            { id: '3h', label: '3ª hora', timeRange: '10:40 - 11:30' },
            { id: 'recreo', label: 'Recreo', timeRange: '11:30 - 12:00' },
            { id: '4h', label: '4ª hora', timeRange: '12:00 - 12:55' },
            { id: '5h', label: '5ª hora', timeRange: '12:55 - 13:45' },
            { id: '6h', label: '6ª hora', timeRange: '13:45 - 14:35' },
        ];

        const DAYS = [
            { dayName: 'Lunes', date: '23/03' },
            { dayName: 'Martes', date: '24/03' },
            { dayName: 'Miércoles', date: '25/03' },
            { dayName: 'Jueves', date: '26/03' },
            { dayName: 'Viernes', date: '27/03' },
        ];

        const App = () => {
            const [schedule, setSchedule] = useState(() => {
                const saved = localStorage.getItem('ies-lucia-schedule');
                return saved ? JSON.parse(saved) : {};
            });
            const [modal, setModal] = useState({ open: false, day: '', slotId: '' });
            const [formData, setFormData] = useState({ actividad: '', profesor: '', grupo: '', lugar: '' });
            const [passModal, setPassModal] = useState({ open: false, action: '' });
            const [passInput, setPassInput] = useState('');

            useEffect(() => {
                localStorage.setItem('ies-lucia-schedule', JSON.stringify(schedule));
            }, [schedule]);

            const handleAdd = () => {
                if (!formData.actividad) return;
                const newS = { ...schedule };
                if (!newS[modal.day]) newS[modal.day] = {};
                if (!newS[modal.day][modal.slotId]) newS[modal.day][modal.slotId] = [];
                newS[modal.day][modal.slotId].push({ ...formData, id: Date.now() });
                setSchedule(newS);
                setModal({ open: false });
                setFormData({ actividad: '', profesor: '', grupo: '', lugar: '' });
            };

            const removeActivity = (day, slotId, id) => {
                const newS = { ...schedule };
                newS[day][slotId] = newS[day][slotId].filter(a => a.id !== id);
                setSchedule(newS);
            };

            const handleExport = async () => {
                const { Document, Packer, Paragraph, Table, TableCell, TableRow, WidthType, AlignmentType, PageOrientation, TextRun, HeadingLevel } = window.docx;
                
                const tableRows = [
                    new TableRow({
                        children: [
                            new TableCell({ children: [new Paragraph({ text: "HORA", alignment: AlignmentType.CENTER, bold: true })], shading: { fill: "f1f5f9" } }),
                            ...DAYS.map(d => new TableCell({ 
                                children: [new Paragraph({ children: [new TextRun({ text: d.dayName.toUpperCase(), bold: true })], alignment: AlignmentType.CENTER })],
                                shading: { fill: "f1f5f9" }
                            }))
                        ]
                    })
                ];

                TIME_SLOTS.forEach(slot => {
                    const cells = [
                        new TableCell({
                            children: [new Paragraph({ text: slot.label, alignment: AlignmentType.CENTER }), new Paragraph({ text: slot.timeRange, alignment: AlignmentType.CENTER })],
                            shading: { fill: slot.id === 'recreo' ? "e2e8f0" : "ffffff" }
                        })
                    ];
                    DAYS.forEach(day => {
                        const acts = schedule[day.dayName]?.[slot.id] || [];
                        const content = acts.flatMap(a => [
                            new Paragraph({ children: [new TextRun({ text: a.actividad.toUpperCase(), bold: true, size: 18 })] }),
                            new Paragraph({ children: [new TextRun({ text: `Prof: ${a.profesor}`, size: 16 })] }),
                            new Paragraph({ children: [new TextRun({ text: `${a.grupo} | ${a.lugar}`, size: 14, color: "666666" })], spacing: { after: 150 } })
                        ]);
                        cells.push(new TableCell({ children: content.length > 0 ? content : [new Paragraph("")] }));
                    });
                    tableRows.push(new TableRow({ children: cells }));
                });

                const doc = new Document({
                    sections: [{
                        properties: { page: { size: { orientation: PageOrientation.LANDSCAPE } } },
                        children: [
                            new Paragraph({ text: "IES LUCÍA DE MEDRANO - SEMANA CULTURAL", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER, spacing: { after: 400 } }),
                            new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows })
                        ]
                    }]
                });

                const blob = await Packer.toBlob(doc);
                saveAs(blob, "Horario_Semana_Cultural_IES.docx");
            };

            const confirmPass = () => {
                if (passInput === '1234') {
                    if (passModal.action === 'clear') setSchedule({});
                    if (passModal.action === 'export') handleExport();
                    setPassModal({ open: false });
                    setPassInput('');
                } else alert("Contraseña incorrecta");
            };

            return (
                <div className="min-h-screen">
                    <header className="bg-white border-b p-4 px-10 flex justify-between items-center sticky top-0 z-40 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 text-white p-2 rounded-xl"><lucide.Calendar size={24} /></div>
                            <div>
                                <h1 className="text-xl font-black text-slate-800 tracking-tight">IES LUCÍA DE MEDRANO</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Semana Cultural: 23-27 Marzo</p>
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setPassModal({open: true, action: 'clear'})} className="text-slate-300 hover:text-red-500 transition-colors"><lucide.Trash2 size={20}/></button>
                            <button onClick={() => setPassModal({open: true, action: 'export'})} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-black text-xs hover:bg-indigo-700 transition-all shadow-md active:scale-95">DESCARGAR WORD</button>
                        </div>
                    </header>

                    <main className="p-8 overflow-x-auto custom-scrollbar">
                        <div className="bg-white border rounded-[2rem] shadow-xl overflow-hidden min-w-[1200px]">
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-slate-800 text-white">
                                        <th className="w-40 p-5 text-[10px] font-black uppercase tracking-widest opacity-50">Hora</th>
                                        {DAYS.map(d => (
                                            <th key={d.dayName} className="p-5 text-left border-l border-white/10">
                                                <div className="text-xl font-black">{d.dayName}</div>
                                                <div className="text-[10px] font-bold text-indigo-400">{d.date}</div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {TIME_SLOTS.map(slot => (
                                        <tr key={slot.id} className={slot.id === 'recreo' ? 'recreo-row' : ''}>
                                            <td className="p-5 text-center border-b border-slate-100 bg-slate-50/50">
                                                <div className="font-black text-xs text-slate-700">{slot.label}</div>
                                                <div className="text-[10px] font-bold text-indigo-600 mt-1">{slot.timeRange}</div>
                                            </td>
                                            {DAYS.map(day => {
                                                const acts = schedule[day.dayName]?.[slot.id] || [];
                                                return (
                                                    <td key={day.dayName+slot.id} className="p-2 border-b border-l border-slate-100 align-top group">
                                                        <div className="space-y-2 mb-2">
                                                            {acts.map(a => (
                                                                <div key={a.id} className="bg-white border border-slate-200 p-3 rounded-xl shadow-sm relative group/item">
                                                                    <button onClick={() => removeActivity(day.dayName, slot.id, a.id)} className="absolute top-1 right-1 opacity-0 group-hover/item:opacity-100 text-slate-300 hover:text-red-500 transition-all"><lucide.X size={12}/></button>
                                                                    <div className="font-black text-[11px] text-slate-900 uppercase leading-tight mb-1">{a.actividad}</div>
                                                                    <div className="text-[10px] font-bold text-indigo-600">{a.profesor}</div>
                                                                    <div className="text-[9px] text-slate-400 font-bold uppercase mt-1">📍 {a.lugar} | {a.grupo}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button 
                                                            onClick={() => setModal({open: true, day: day.dayName, slotId: slot.id})}
                                                            className="w-full py-3 border-2 border-dashed border-slate-100 rounded-xl text-slate-300 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center"
                                                        >
                                                            <lucide.Plus size={18}/>
                                                        </button>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    {/* Modal Añadir */}
                    {modal.open && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in duration-200">
                                <div className="bg-indigo-600 p-8 text-white text-center">
                                    <h2 className="text-2xl font-black uppercase">Nueva Actividad</h2>
                                    <p className="text-xs font-bold opacity-60 mt-1">{modal.day} - {TIME_SLOTS.find(s=>s.id===modal.slotId)?.label}</p>
                                </div>
                                <div className="p-8 space-y-4">
                                    <input placeholder="Nombre de la Actividad" className="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:border-indigo-600 transition-all" value={formData.actividad} onChange={e=>setFormData({...formData, actividad: e.target.value})}/>
                                    <input placeholder="Profesor/a Responsable" className="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:border-indigo-600 transition-all" value={formData.profesor} onChange={e=>setFormData({...formData, profesor: e.target.value})}/>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input placeholder="Grupo" className="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:border-indigo-600 transition-all" value={formData.grupo} onChange={e=>setFormData({...formData, grupo: e.target.value})}/>
                                        <input placeholder="Lugar" className="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:border-indigo-600 transition-all" value={formData.lugar} onChange={e=>setFormData({...formData, lugar: e.target.value})}/>
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button onClick={() => setModal({open: false})} className="flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 uppercase text-xs">Cancelar</button>
                                        <button onClick={handleAdd} className="flex-[2] py-4 bg-indigo-600 text-white font-black rounded-xl shadow-lg hover:bg-indigo-700 uppercase text-xs tracking-widest">Añadir Actividad</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Pass */}
                    {passModal.open && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white p-10 rounded-[2.5rem] w-full max-w-sm text-center shadow-2xl">
                                <h3 className="text-2xl font-black text-slate-800 mb-2">Seguridad</h3>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8 italic">Introduce "1234" para continuar</p>
                                <input 
                                    type="password" 
                                    autoFocus 
                                    className="w-full p-5 bg-slate-50 border rounded-2xl text-center text-3xl font-black tracking-widest mb-8 outline-none focus:border-indigo-600"
                                    value={passInput}
                                    onChange={e=>setPassInput(e.target.value)}
                                    onKeyDown={e=>e.key==='Enter' && confirmPass()}
                                />
                                <button onClick={confirmPass} className="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl shadow-xl hover:bg-indigo-700 uppercase text-xs tracking-widest">Confirmar</button>
                                <button onClick={() => setPassModal({open: false})} className="mt-4 text-slate-300 font-bold text-[10px]">CERRAR</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
